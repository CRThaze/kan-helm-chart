{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kan.fullname" . }}
  labels:
    {{- include "kan.labels" . | nindent 4 }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ required "auth.secret is required unless existingSecret is set" .Values.auth.secret | quote }}
  POSTGRES_URL: {{ required "database.url is required unless existingSecret is set" .Values.database.url | quote }}
{{- end }}
